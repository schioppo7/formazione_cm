---
- name: Configurazione Docker Registry con Podman
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Download immagine ufficial del Registry da Docker Hub
      containers.podman.podman_image:
        name: docker.io/library/registry
        tag: "2"
        state: present
    
    - name: Avviare il container del Registry 
      containers.podman.podman_container:
        name: local-registry
        image: docker.io/library/registry:2
        state: started
        ports:
          - "5000:5000"