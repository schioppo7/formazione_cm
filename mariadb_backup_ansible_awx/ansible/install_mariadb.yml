---
- name: Installazione MariaDB
  hosts: all
  become: true

  tasks:
    - name: Installa MariaDB e MariaDB client su Alpine
      ansible.builtin.shell: |
        if apk info -e mariadb >/dev/null 2>&1 &&
           apk info -e mariadb-client >/dev/null 2>&1; then
          echo "ALREADY_PRESENT"
        else
          apk add --no-cache mariadb mariadb-client
          echo "PACKAGES_ADDED"
        fi
      register: mariadb_install
      changed_when: "'PACKAGES_ADDED' in mariadb_install.stdout"