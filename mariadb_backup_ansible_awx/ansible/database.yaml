---
- name: Crea DB e dati test
  hosts: source
  become: true


  tasks: 
    - name: crea DB test
      ansible.builtin.shell: |
         mariadb << 'SQL'
         CREATE DATABASE IF NOT EXISTS testdb;
         USE testdb;


         CREATE TABLE IF NOT EXISTS users (
           id INT AUTO_INCREMENT PRIMARY KEY,
           name VARCHAR(50),
           email VARCHAR(50)
          );

        
         INSERT INTO users (name,email) VALUES
            ('Davide', 'davide@test.it'),
            ('Paolo', 'paolo@test.it'),
            ('Federico', 'federico@test.it');
         SQL
